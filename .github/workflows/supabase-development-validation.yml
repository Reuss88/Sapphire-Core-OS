name: Supabase development validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - "tests/architecture/**"
      - "scripts/supabase-dev.sh"
      - "engineering/SUPABASE-DEVELOPMENT-WORKFLOW.md"
      - ".env.example"
      - ".github/workflows/supabase-development-validation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "tests/architecture/**"
      - "scripts/supabase-dev.sh"
      - "engineering/SUPABASE-DEVELOPMENT-WORKFLOW.md"
      - ".env.example"
      - ".github/workflows/supabase-development-validation.yml"

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/supabase-dev.sh static-check
