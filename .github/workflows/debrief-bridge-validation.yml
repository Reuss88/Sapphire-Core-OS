name: Debrief bridge validation

on:
  pull_request:
    paths:
      - "debriefs/**"
      - "tools/validate_debrief_bridge.py"
      - "tests/test_validate_debrief_bridge.py"
      - ".github/workflows/debrief-bridge-validation.yml"
  push:
    branches: [main]
    paths:
      - "debriefs/**"
      - "tools/validate_debrief_bridge.py"
      - "tests/test_validate_debrief_bridge.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_debrief_bridge.py
      - run: python -m unittest discover -s tests -p "test_validate_debrief_bridge.py"
